name: Android build and glass checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33]
    env:
      ANDROID_SDK: /usr/local/lib/android/sdk
      BT_VER: 34.0.0
      PLAT_VER: '34'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build development APK
        run: bash build.sh 1 1.53.0-dev
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/test-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-checks
          path: |
            build-manual/screenshots/
            build-manual/android-test.log
            build-manual/logcat.txt
